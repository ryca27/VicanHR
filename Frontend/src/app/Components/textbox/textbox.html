<div class="input-wrapper">
  <input 
    type="text" 
    id="textbox" 
    placeholder="" 
    class="floating-input" 
    [formControl]="inputControl" 
    [value]="value()" 
    (input)="value.set($event.target.value)" 
    [disabled]="disabled()" 
    />
  
  <label for="textbox" class="floating-label">{{label}}</label>
</div>
