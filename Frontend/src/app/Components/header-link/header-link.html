
<div class="header-link-container">
    <div class="link-wrapper">
        <span><a href="">Home</a></span>
        <span><a href="something">Employees</a></span>
        <span><a href="something">Attendance</a></span>
        <span><a href="payroll">Payroll</a></span>
        <span><a href="/expay" routerLink="/expay" routerLinkActive="active" ariaCurrentWhenActive="page">Expenses and Payments</a></span>
    </div>
    <div class="username-wrapper">
      @if (browserReady() && authService.isAuthInitialized()) {
        <img
          src="assets/user-icon-simple.png"
          style="width: 40px; height: 40px;"
          alt="User"
        />
    
        @if (authService.user(); as user) {
          <span>{{ user.username }}</span>
          <span>{{ user.role }}</span>
        } @else {
          <span>Not logged in</span>
        }
      }
    </div>
</div>
