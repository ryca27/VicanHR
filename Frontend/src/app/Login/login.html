
<main class="login-page">

    <section
      class="login-card"
      aria-labelledby="login-title"
    >
  
      <!-- VICAN LOGO -->
      <div class="brand">
        <img
          class="brand-logo"
          src="/assets/vican-login/vican-logo.png"
          alt="VICAN Security Services Corporation"
        />
      </div>
  
      <div
        class="brand-divider"
        aria-hidden="true"
      ></div>
  
      <!-- TITLE -->
      <header class="card-heading">
        <h1 id="login-title">Vican HR</h1>
        <p>HR &amp; Payroll System</p>
      </header>
  
      <!-- LOGIN FORM -->
      <form
        class="login-form"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >
  
        <!-- USERNAME -->
        <div class="field">
  
          <label
            class="sr-only"
            for="vican-username"
          >
            Username
          </label>
  
          <div
            class="input-shell"
            [class.invalid]="usernameInvalid"
          >
  
            <svg
              class="field-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="7.5" r="4"></circle>
              <path
                d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"
              ></path>
            </svg>
  
            <input
              id="vican-username"
              type="text"
              formControlName="username"
              placeholder="Username"
              autocomplete="username"
              [attr.aria-invalid]="usernameInvalid"
              [attr.aria-describedby]="
                usernameInvalid ? 'username-error' : null
              "
            />
  
          </div>
  
          @if (usernameInvalid) {
            <small
              id="username-error"
              class="field-error"
            >
              Username is required.
            </small>
          }
  
        </div>
  
        <!-- PASSWORD -->
        <div class="field">
  
          <label
            class="sr-only"
            for="vican-password"
          >
            Password
          </label>
  
          <div
            class="input-shell"
            [class.invalid]="passwordInvalid"
          >
  
            <svg
              class="field-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect
                x="5"
                y="10"
                width="14"
                height="11"
                rx="1.7"
              ></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              <path d="M12 14v3"></path>
            </svg>
  
            <input
              id="vican-password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Password"
              autocomplete="current-password"
              [attr.aria-invalid]="passwordInvalid"
              [attr.aria-describedby]="
                passwordInvalid ? 'password-error' : null
              "
            />
  
            <!-- SHOW / HIDE PASSWORD -->
            <button
              type="button"
              class="visibility-button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="
                showPassword ? 'Hide password' : 'Show password'
              "
              [attr.aria-pressed]="showPassword"
            >
  
              @if (!showPassword) {
  
                <!-- PASSWORD HIDDEN -->
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 3l18 18"></path>
                  <path
                    d="M10.6 5.1a10.7 10.7 0 0 1 1.4-.1c5 0 8.7 3.4 10 7-0.5 1.4-1.4 2.8-2.6 3.9"
                  ></path>
                  <path
                    d="M6.2 6.3C4.3 7.6 2.9 9.6 2 12c1.3 3.6 5 7 10 7 1.3 0 2.5-.2 3.6-.6"
                  ></path>
                  <path d="M10 10a3 3 0 0 0 4 4"></path>
                </svg>
  
              } @else {
  
                <!-- PASSWORD VISIBLE -->
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
  
              }
  
            </button>
  
          </div>
  
          @if (passwordInvalid) {
            <small
              id="password-error"
              class="field-error"
            >
              Password is required.
            </small>
          }
  
        </div>
  
        <!-- REMEMBER ME / FORGOT PASSWORD -->
        <div class="form-options">
  
          <label class="remember-option">
            <input
              type="checkbox"
              formControlName="rememberMe"
            />
            <span>Remember me</span>
          </label>
  
          <button
            type="button"
            class="forgot-link"
            (click)="onForgotPassword()"
          >
            Forgot password?
          </button>
  
        </div>
  
        <!-- SERVER ERROR -->
        @if (errorMessage) {
          <p
            class="server-error"
            role="alert"
          >
            {{ errorMessage }}
          </p>
        }
  
        <!-- LOGIN BUTTON -->
        <button
          class="login-button"
          type="submit"
          [disabled]="loading"
        >
          @if (loading) {
            Signing in...
          } @else {
            Log In
          }
        </button>
  
      </form>
  
    </section>
  
  </main>
