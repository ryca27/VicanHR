<div class="container">
    <div class="row-container list">
        <h1>Payroll Cutoffs</h1>
        <h3>View Existing cutoff</h3>
        <app-table
            [columnsInput]="tableColumns"
            [rowsInput]="tableRows"
            [rowsIdInput]="tableRowsId"
        ></app-table>
    </div>
    <div class="row-container action">
      <form [formGroup]="createPayrollFormGroup">
        <h1>New Payroll Cutoff</h1>
        <h3>Create a new payroll</h3>
          <app-double-date-picker [label]="'Cutoff Period'"
          [startDate]="createPayrollFormGroup.value.startDate ?? ''"
          [endDate]="createPayrollFormGroup.value.endDate ?? ''"
          (startDateOutput)="startDateOutputListener($event)"
          (endDateOutput)="endDateOutputListener($event)"
          ></app-double-date-picker>

          <div class="requirements-container">
            <h3>Required Inputs</h3>
            <p>
                -Attendance <br>
                -Expenses
            </p>
          </div>
          <div class="button-container">
            <app-button [label]="'Start Prepartion'" (click)="onSubmit()"
            [color]="'blue'"
            [disabled]="!createPayrollFormGroup.valid"
            [size]="'medium'"
        ></app-button>
          </div>
      </form>
        
          
    </div>
</div>

<upload-modal 
  [isOpen]="isUploadModalVisible" 
  [title]="'Upload File'" 
  [startDate]="createPayrollFormGroup.value.startDate ?? ''"
  [endDate]="createPayrollFormGroup.value.endDate ?? ''"
  (isSubmit)="closeUploadModalListener($event)"> </upload-modal>

<accepted-rows-modal
[isOpen]="isAcceptedRowsModalVisible"
(closeModalOutput)="closeAcceptedRowsListener($event)"
>

</accepted-rows-modal>
