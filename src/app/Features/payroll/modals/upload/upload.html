@if(isOpen){
    <div class="modal-overlay" (click)="closeModal()">
        <!-- (click)="$event.stopPropagation()" prevents closing when clicking inside the content box -->
        <div class="modal-container" (click)="$event.stopPropagation()">
          
          <div class="modal-header">
            <h3>{{ title }}</h3>
          </div>
      
          <div class="modal-body">
            <form [formGroup]="uploadFormGroup">
                <app-double-date-picker [label]="'Cutoff Period'"
                [startDate]="startDate"
                [endDate]="endDate"
                [startDateDisabled]="true"
                [endDateDisabled]="true"
                (startDateOutput)="startDateOutputListener($event)"
                (endDateOutput)="endDateOutputListener($event)"
                ></app-double-date-picker>
                <div class="add-file-container" formArrayName="uploadFileArray">
                  @if(uploadFileArray.length > 0){
                    @for(uploadFile of uploadFileArray.controls; track uploadFile; let i = $index){
                      <div [formGroupName]="i">
                        <app-dropdown 
                          [options]="fileTypeOptions" 
                          [label]="fileTypeLabel" 
                          formControlName="fileType">
                        </app-dropdown>

                        @if(uploadFileArray.controls[i].get('fileType')?.value == 'expenses' ){
                          <app-dropdown
                            [options]="expenseTypeOptions"
                            [label]="expenseTypeLabel"
                            formControlName="expenseType"
                          ></app-dropdown>
                        }
                        <app-file-box [id]="i"
                        (fileContentOutput)="fileContentOutputListener($event,i )"
                        (fileNameOutput)="fileNameOutputListener($event,i )"
                      ></app-file-box>
                      @if(i!=0){
                        <div class="button-container">
                          <button mat-icon-button (click)="removeFileGroup(i)" aria-label="Delete item">
                            <mat-icon>delete</mat-icon>
                          </button>
                        </div>
                      }
                        
                      </div>
                    }
                  }
                </div>

                <div class="plus-container">
                  <button mat-icon-button (click)="addUploadFileGroup()"><img src="assets/plus-icon.png" style="width:40px; height:40px;"></button>
                </div>

                <div class="button-container">
                  <app-button [label]="'Validate'" (click)="validateInput()"
                    [color]="'blue'"
                    [size]="'long'"
                    [disabled]="false"
                  ></app-button>
                  <app-button [label]="'Upload'" (click)="submitForm()"
                  [color]="'gray'"
                  [disabled]="false"
                  [size]="'long'"
                ></app-button>
                <app-button [label]="'Cancel'" (click)="closeModal()"
                [color]="'red'"
                [disabled]="false"
                [size]="'long'"
              ></app-button>
              
                </div>
                
            </form>

          </div>
      
        </div>
      </div>
}
