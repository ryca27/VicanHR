@if(isOpen){
    <div class="modal-overlay">
        <div class="modal-container" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h3>{{ title }}</h3>
              </div>
            <div class="modal-body">
                <div class="header-container">
                    <app-table-tab
                        [tabNames]="tabNames"
                        (activeTabOutput)="activeTabOutputListener($event)"
                        ></app-table-tab>
                </div>
                <div class="body-container">
                    @if(activeTab=='Attendance'){
                        <app-table
                        [columnsInput]="attendanceData.tableColumns"
                        [rowsInput]="attendanceData.tableRows"
                    ></app-table>
                    }
    
                    @if(activeTab=='Equipment'){
                        <app-table
                        [columnsInput]="equipmentData.tableColumns"
                        [rowsInput]="equipmentData.tableRows"
                    ></app-table>
                    }
    
                    @if(activeTab=='Training'){
                        <app-table
                        [columnsInput]="trainingData.tableColumns"
                        [rowsInput]="trainingData.tableRows"
                    ></app-table>
                    }
                </div>

                <div class="button-container">
                    <app-button
                    [label]="'Cancel'"
                    [color]="'red'"
                    [size]="'long'"
                    (click)="closeAcceptedRowsModal()"
                    ></app-button>
                    <app-button
                    [label]="'Upload'"
                    [color]="'gray'"
                    [size]="'long'"
                    (click)="uploadRows()"
                    ></app-button>
                </div>
                
            </div>
        </div>
    </div>
}
