<div class="container">
    <div class="sub-header-container">
        <div class="wrapper left">
            <div class="filter-component">
                <app-textbox
                [label]="'Name'"
                ></app-textbox>
            </div>
            <div class="filter-component">
                <app-dropdown
                [label]="'Detachment'"
                [options]="detachmentOptions"
                ></app-dropdown>
            </div>
            <div class="filter-component">
                <app-dropdown
                [label]="'Status'"
                [options]="statusOptions"
                ></app-dropdown>
            </div>
        </div>

        <div class="wrapper right">
            <div class="filter-component button-container">
                <app-button
                [label]="'Preview'"
                [color]="'black'"
                [size]="'long'"
                (click)="onPreview()"
                ></app-button>
            </div>
    
            <div class="filter-component button-container">
                <app-button
                [label]="'Finalize'"
                [color]="'black'"
                [size]="'long'"
                (click)="onPreview()"
                ></app-button>
            </div>
    
            <div class="filter-component button-container">
                <app-button
                [label]="'Download'"
                [color]="'black'"
                [size]="'long'"
                (click)="onPreview()"
                ></app-button>
            </div>
    
            <div class="status-container">
                <div class="circle-container"><div class="circle green"></div><span> Payroll Ready</span> <br></div>
                <div class="circle-container"><div class="circle yellow"></div><span> For Approval</span> <br></div>
                <div class="circle-container"><div class="circle red"></div><span> Needs Attention</span> <br></div>
                <!-- <div class="circle"></div><span> For Approval</span> <br>
                <div class="circle"></div><span> Needs Attention</span> <br>
                 -->
                <!-- <div class="circle container"><div class="circle"></div><span> For Approval</span> <br></div>
                <div class="circle container"><div class="circle"></div><span> Needs Attention</span> <br></div> -->
            </div>
        </div>

       
    </div>
    <div class="statistics-container">
        <div class="card-container">
            <app-card 
            [header]="'Employees'"
            [display]="employeeCount.toString()"
            [color]="'blue'"
            ></app-card>
        </div>
        <div class="card-container">
            <app-card 
            [header]="'Gross Pay'"
            [display]="grossPay.toString()"
            [color]="'green'"
            ></app-card>
        </div>
        <div class="card-container">
            <app-card 
            [header]="'Deductions'"
            [display]="'PHP' + deductions.toString()"
            [color]="'yellow'"
            ></app-card>
        </div>
        <div class="card-container">
            <app-card 
            [header]="'Net Pay'"
            [display]="'PHP ' + netPay.toString()"
            [color]="'red'"
            ></app-card>
        </div>
        
    </div>
    <div class="table-container">
        <app-table
        [columns]="mockData.tableColumns"
        [rows]="mockData.tableRows"></app-table>
    </div>
</div>
