services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vican
      POSTGRES_USER: vican
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - payroll_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vican -d vican"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DJANGO_DEBUG: "true"
      POSTGRES_DB: vican
      POSTGRES_USER: vican
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate && exec gunicorn config.wsgi:application --bind 0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  payroll_db:
